name: Patina

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  craft:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Calculate
        run: |
          # 1. Blame → per-commit line counts (in memory)
          BLAME=$(git blame HEAD -- . 2>/dev/null | \
            awk '{ sha=$1; gsub(/^\^/,"",sha); if(sha!~/^0+$/) c[sha]++ }
                 END { for(s in c) print s, c[s] }')
          echo "DEBUG BLAME:" && echo "$BLAME"

          # 2. Extract Craft trailers only for commits that have surviving lines
          SCORES=$(echo "$BLAME" | awk '{print $1}' | \
            xargs git log --no-walk --format="%h %(trailers:key=Craft,valueonly=true)" | \
            awk '$2 ~ /^[0-9]+(\.[0-9]+)?$/ && $2 + 0 <= 1 {
              $2 = sprintf("%.4f", $2)
              print
            }')
          echo "DEBUG SCORES:" && echo "$SCORES"

          # 3. Merge and compute R = Σ(Sₖ × Lₖ) / Σ(Lₖ)
          RESULT=$(awk '
            NR==FNR { if($1) m[$1]=$2; next }
            { s = m[$1] ? m[$1] : 0; w += s * $2; t += $2 }
            END {
              if (t == 0) r = 1
              else r = w / t
              printf "SCORE=%.4f\nLINES=%d\n", r, t
            }
          ' <(echo "$SCORES") <(echo "$BLAME"))
          echo "DEBUG RESULT:" && echo "$RESULT"
          echo "$RESULT" | tee -a "$GITHUB_ENV"

      - name: Generate Badge
        run: |
          mkdir -p .patina
          pct=$(awk "BEGIN { printf \"%d\", $SCORE * 100 }")
          sed "s/100%/${pct}%/g" badge.svg > .patina/badge.svg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .patina
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
