name: Patina

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  craft:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Blame
        run: |
          # Blame
          mkdir -p .patina
          git ls-files -z | \
          xargs -0 -n 1 git blame --abbrev=40 HEAD -- 2>/dev/null | \
          awk '
            { sha=$1; gsub(/^\^/,"",sha); if(sha!~/^0+$/) c[sha]++ }
            END { for(s in c) print s, c[s] }
          ' > .patina/tmp

      - name: Craft lookup
        run: |
          # Craft lookup
          TMP=$(cat .patina/tmp)
          awk '
            NR==FNR { m[$1]=$2; next }
            { print $0, m[$1] }
          ' <(echo "$TMP" | awk '{print $1}' | \
              xargs -r git log --no-walk --format="%H %(trailers:key=Craft,valueonly=true)" | \
              awk '
                $2 ~ /^[0-9]+(\.[0-9]+)?$/ && $2 + 0 <= 1 {
                $2 = sprintf("%.4f", $2); print
              }') \
            <(echo "$TMP") > .patina/tmp

      - name: Score
        run: |
          # Score
          awk '
            { if (NF < 3) exit 1; w += $3 * $2; s += $2 }
            END { printf "SCORE=%d\n", w / s * 100 }
          ' .patina/tmp >> "$GITHUB_ENV"
          rm .patina/tmp

      - name: Generate Badge
        run: |
          # Generate Badge
          if [ -z "$SCORE" ]; then
            sed "s/100%/—%/g" badge.svg > .patina/badge.svg
          else
            sed "s/100%/${SCORE}%/g" badge.svg > .patina/badge.svg
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .patina
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
