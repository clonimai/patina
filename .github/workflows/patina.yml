name: Patina

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  craft:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Calculate
        run: |
          # 1. Blame → per-commit line counts
          BLAME=$(git blame HEAD -- . 2>/dev/null | \
            awk '{ sha=$1; gsub(/^\^/,"",sha); if(sha!~/^0+$/) c[sha]++ }
                 END { for(s in c) print s, c[s] }')

          # 2. Look up Craft values, merge with BLAME, compute score
          #    Missing/invalid Craft on any surviving commit → empty SCORE
          awk '
            NR==FNR { if($1) m[$1]=$2; next }
            {
              craft = m[$1] ? m[$1] : ""
              if (craft == "") missing = 1
              w += $2 * (craft ? craft : 0)
              t += $2
            }
            END {
              if (missing) print "SCORE="
              else printf "SCORE=%.4f\n", w / t
            }
          ' <(echo "$BLAME" | awk '{print $1}' | \
              xargs git log --no-walk --format="%h %(trailers:key=Craft,valueonly=true)" | \
              awk '$2 ~ /^[0-9]+(\.[0-9]+)?$/ && $2 + 0 <= 1 {
                print $1, sprintf("%.4f", $2)
              }') \
            <(echo "$BLAME") | tee -a "$GITHUB_ENV"

      - name: Generate Badge
        run: |
          mkdir -p .patina
          if [ -z "$SCORE" ]; then
            sed "s/100%/—%/g" badge.svg > .patina/badge.svg
          else
            pct=$(awk "BEGIN { printf \"%d\", $SCORE * 100 }")
            sed "s/100%/${pct}%/g" badge.svg > .patina/badge.svg
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .patina
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
